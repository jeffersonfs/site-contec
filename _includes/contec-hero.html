<!-- Hero Section (Banner Capa Site - BannerCapaSite1 Layout) -->
<div class="kn-hero" id="contecHeroBanner">
  <!-- Video de Fundo Animado (Executa uma única vez e permanece como plano de fundo) -->
  <video
    class="kn-hero-video-bg"
    id="heroVideo"
    autoplay
    muted
    playsinline
    preload="auto"
    poster="{{ 'assets/img/planodefundo1.png' | relative_url }}"
    aria-hidden="true"
  >
    <source src="{{ 'assets/img/video_animado.webm' | relative_url }}" type="video/webm">
    <source src="{{ 'assets/img/video_animado.mp4' | relative_url }}" type="video/mp4">
  </video>

  <!-- Camada de sobreposição para contraste e suporte a tema escuro -->
  <div class="kn-hero-overlay" aria-hidden="true"></div>

  <!-- Hero Main Banner Content -->
  <div class="kn-hero-content">
    <!-- Event Main Title -->
    <h1 class="banner-title text-center" id="main-banner-heading">
      <span class="banner-title-main">III CONTEC</span>
      <span class="banner-title-sub">MATOPIBA</span>
    </h1>

    <!-- Event Subtitle / Description -->
    <h2 class="banner-subtitle text-center">
      <span>III CONGRESSO DE TECNOLOGIA,</span>
      <span>ENGENHARIA E CIÊNCIA DO MATOPIBA</span>
    </h2>

    <!-- Golden Pill Date/Location Badge -->
    <div class="banner-pill-badge" id="banner-date-badge">
      <span>19-23 DE OUTUBRO DE 2026 - BALSAS/MA</span>
    </div>

    <!-- Location Divider with Golden Lines -->
    <div class="banner-location-divider" aria-label="Localização: Balsas/MA">
      <span class="banner-line"></span>
      <span class="banner-location-text">BALSAS/MA</span>
      <span class="banner-line"></span>
    </div>

    <!-- Script Handwriting Tagline -->
    <p class="banner-tagline text-center">Saberes conectados para a resolução de problemas complexos!</p>

    <!-- Interactive CTAs Group -->
    <div class="kn-cta-group" role="group" aria-label="Ações principais do evento">
      <a href="{{ '/inscricoes/' | relative_url }}" class="kn-btn-primary" id="btn-hero-inscricao">
        <span class="kn-btn-title-main">Inscreva-se Gratuitamente</span>
        <span class="kn-btn-subtext">Passo a passo SIGEventos</span>
      </a>
      <a href="{{ '/programacao/' | relative_url }}" class="kn-btn-secondary" id="btn-hero-programacao">
        <span class="kn-btn-title-main">Ver Programação Completa</span>
        <span class="kn-btn-subtext">Palestras & Minicursos</span>
      </a>
    </div>
  </div>

  <!-- Botão sutil para rever animação do banner -->
  <button
    id="heroVideoReplayBtn"
    class="kn-hero-replay-btn"
    type="button"
    aria-label="Rever animação do banner"
    title="Rever animação do banner"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
      <path d="M3 3v5h5"/>
    </svg>
    <span>Rever animação</span>
  </button>
</div>

<script>
  (function() {
    const heroVideo = document.getElementById('heroVideo');
    const replayBtn = document.getElementById('heroVideoReplayBtn');
    if (!heroVideo) return;

    // Garante propriedades cruciais para autoplay em todos os navegadores móveis e desktop
    heroVideo.muted = true;
    heroVideo.defaultMuted = true;

    // Dispara a reprodução automática
    const playPromise = heroVideo.play();
    if (playPromise !== undefined) {
      playPromise.catch(function() {
        // Se autoplay for bloqueado pelo navegador/modo economia, disponibiliza botão para iniciar
        if (replayBtn) replayBtn.classList.add('is-visible');
      });
    }

    // Ao finalizar a exibição do vídeo (executado uma única vez):
    heroVideo.addEventListener('ended', function() {
      // O vídeo para naturalmente no último quadro e se estabelece como imagem de fundo
      heroVideo.classList.add('is-ended');
      if (replayBtn) {
        replayBtn.classList.add('is-visible');
      }
    });

    // Permite que o usuário clique para rever a animação a qualquer momento se desejar
    if (replayBtn) {
      replayBtn.addEventListener('click', function() {
        replayBtn.classList.remove('is-visible');
        heroVideo.currentTime = 0;
        heroVideo.play();
      });
    }
  })();
</script>
